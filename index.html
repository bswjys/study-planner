<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장신대 플래너</title>
<meta name="description" content="장신대 신학대학원 입학고사 회독 공부 계획과 진도 관리">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="장신대 플래너">
<meta name="theme-color" content="#F2F4F6">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF;
  --pri:#3182F6; --pri-soft:#E8F3FF; --pri-strong:#1B64DA;
  --tx:#191F28; --tx2:#6B7684; --tx3:#B0B8C1;
  --line:#E5E8EB; --line2:#F2F4F6;
  --red:#F04452; --red-soft:#FFF0F1;
  --green:#00C471; --green-soft:#E9FBF3;
  --gaer:#7C5CFC; --gaer-strong:#5B3FD6; --gaer-soft:#F1EDFF;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,"Helvetica Neue",Arial,"Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.45;letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  word-break:keep-all;overflow-wrap:break-word;
}
button{font:inherit;letter-spacing:inherit;color:inherit;border:0;background:transparent;padding:0;-webkit-appearance:none;appearance:none}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
b{font-weight:700}

/* ---------- shell ---------- */
.appbar{
  position:sticky;top:0;z-index:30;
  padding:calc(var(--safe-t) + 10px) 0 10px;
  background:rgba(242,244,246,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.appbar-in{max-width:560px;margin:0 auto;padding:0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.appbar h1{font-size:24px;font-weight:800;letter-spacing:-0.035em;line-height:1.2}
.appbar .sub{font-size:12px;color:var(--tx2);font-weight:600;padding-bottom:3px;white-space:nowrap}
main{max-width:560px;margin:0 auto;padding:0 20px calc(84px + var(--safe-b));}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 1px 2px rgba(17,24,39,.03)}
.card.tight{padding:16px 18px}
.card.soft{background:var(--pri-soft)}
.card.pressable{cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.start{align-items:flex-start}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13px;line-height:1.4}
.tiny{color:var(--tx3);font-size:11.5px;line-height:1.4}
.h3{font-size:17px;font-weight:700;letter-spacing:-0.02em}
.h2{font-size:19px;font-weight:800;letter-spacing:-0.03em}
.section-title{font-size:14px;font-weight:800;color:var(--tx);margin:22px 4px 9px;letter-spacing:-0.02em}
.section-title:first-child{margin-top:4px}
.divider{height:1px;background:var(--line2);margin:14px -20px}

/* ---------- pills / badges ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.pill.blue{background:var(--pri-soft);color:var(--pri-strong)}
.pill.gray{background:#F2F4F6;color:var(--tx2)}
.pill.green{background:var(--green-soft);color:#00985B}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.line{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--tx2)}

/* ---------- hero / dday ---------- */
.dday{font-size:42px;font-weight:800;letter-spacing:-0.05em;line-height:1.06;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.dday small{font-size:15px;font-weight:700;letter-spacing:0;margin-left:4px;color:var(--tx2)}

/* ---------- progress ---------- */
.metric{margin-top:16px}
.metric:first-child{margin-top:0}
.metric .lab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.metric .name{font-size:14px;font-weight:700}
.metric .name span{font-weight:600;color:var(--tx3);font-size:12px;margin-left:5px}
.metric .val{font-size:15px;font-weight:800;color:var(--pri);letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.metric .val.zero{color:var(--tx3)}
.bar{height:8px;border-radius:999px;background:#E8EBEE;overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:999px;background:var(--pri);transition:width .45s cubic-bezier(.22,.8,.24,1)}
.bar.thin{height:6px}
.bar.muted>i{background:var(--tx3)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12px;color:var(--tx2);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- today study ---------- */
.study-top{display:flex;align-items:center;gap:12px}
.study-badge{width:44px;height:44px;border-radius:14px;background:var(--pri-soft);color:var(--pri-strong);display:grid;place-items:center;font-size:15px;font-weight:800;flex:0 0 auto}
.card.soft .study-badge{background:#fff;color:var(--pri)}
.seg-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.seg-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:15px;font-weight:700;letter-spacing:-0.02em}
.seg-line .n{font-size:12.5px;color:var(--tx2);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg-line .del{color:var(--red);font-size:11px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  border:0;border-radius:14px;padding:15px 16px;margin-top:16px;
  background:var(--pri);color:#fff;font-size:16px;font-weight:800;letter-spacing:-0.02em;
  cursor:pointer;transition:transform .1s, background .15s;
}
.btn:active{transform:scale(.985);background:var(--pri-strong)}
.btn.ghost{background:#F2F4F6;color:var(--tx)}
.btn.ghost:active{background:#E8EBEE}
.btn.done{background:var(--green-soft);color:#00985B}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:11px;width:auto;margin:0}
.btn-row{display:flex;gap:8px;margin-top:16px}
.btn-row .btn{flex:1;min-width:0;margin-top:0;padding:15px 10px;font-size:15.5px}
.btn-row .btn.wide{flex:1.45}

/* ---------- 공부량 조정 ---------- */
.adj-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;font-size:13.5px;font-weight:800;color:var(--pri-strong);font-variant-numeric:tabular-nums}
.linkbtn{font-size:12.5px;font-weight:800;color:var(--tx2);background:#F2F4F6;border-radius:10px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.linkbtn:active{background:#E8EBEE}
.adj-wrap{display:flex;flex-direction:column;gap:16px}
.adj-book-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:800;margin:0 2px 8px;letter-spacing:-0.02em}
.adj-book-head span{font-size:11.5px;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.chcell{border:0;border-radius:11px;background:#F2F4F6;color:var(--tx2);height:44px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;cursor:pointer;transition:background .12s,color .12s,transform .1s;padding:0}
.chcell.on{background:var(--pri);color:#fff}
.chcell:active{transform:scale(.94)}

/* ---------- 교재별(성경 · 개론) ---------- */
.trk-title{font-size:12px;font-weight:800;color:var(--tx3);margin-bottom:2px}
.trk{display:flex;align-items:flex-start;gap:10px;margin-top:12px}
.trk .ti{font-size:14px;line-height:1.25;flex:0 0 auto}
.trk .trow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.trk .tname{font-size:13.5px;font-weight:800;letter-spacing:-0.02em}
.trk .tval{font-size:13px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums}
.trk .tval.zero{color:var(--tx3)}
.trk .bar{margin-top:6px}
.trk .foot{margin-top:5px;font-size:11.5px}
.bar.thin.g>i{background:var(--gaer)}
.track-row{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--tx2);margin-top:4px}
.seg-list>.track-row:first-child{margin-top:0}
.track-row .tico{font-size:13px;line-height:1}
.track-row .tname{color:var(--tx);font-weight:800;letter-spacing:-0.02em}
.track-row .tn2{margin-left:auto;font-size:12px;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}
.tchk{width:22px;height:22px;border-radius:50%;border:2px solid #D5DAE0;background:#fff;display:grid;place-items:center;flex:0 0 auto;margin-left:2px;padding:0;cursor:pointer}
.tchk svg{width:12px;height:12px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tchk.on{background:var(--pri);border-color:var(--pri)}
.tchk.on svg{opacity:1}
.seg-list.g-list{margin-top:12px}
.seg-list.g-list .track-row .tchk.on{background:var(--gaer);border-color:var(--gaer)}
.item .t2.g{color:var(--gaer-strong)}
.adj-sec-head{font-size:13.5px;font-weight:800;letter-spacing:-0.02em;color:var(--tx)}
.adj-sec-head.g{color:var(--gaer-strong)}
.adj-sum.g{color:var(--gaer-strong)}
.adj-book-head.g span{color:var(--tx3)}
.gchcell{border:0;border-radius:11px;background:#F2F4F6;color:var(--tx2);height:44px;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;cursor:pointer;transition:background .12s,color .12s,transform .1s;padding:0}
.gchcell.on{background:var(--gaer);color:#fff}
.gchcell:active{transform:scale(.94)}

/* ---------- week strip ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:14px 10px}
.wcell{border:0;background:transparent;border-radius:12px;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.wcell .wd{font-size:10.5px;font-weight:700;color:var(--tx3)}
.wcell .wn{font-size:15px;font-weight:800;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.wcell .ws{font-size:9.5px;font-weight:700;color:var(--tx3);height:13px;line-height:13px}
.wcell.done{background:var(--pri-soft)}
.wcell.done .wn{color:var(--pri-strong)}
.wcell.done .ws{color:var(--pri)}
.wcell.sun .wd,.wcell.sun .wn{color:var(--tx3)}
.wcell.sun{background:#FAFBFC}
.wcell.today{box-shadow:inset 0 0 0 2px var(--pri)}
.wcell.miss .ws{color:var(--red)}

/* ---------- list ---------- */
.list{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(17,24,39,.03)}
.item{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:13px 16px;background:#fff;border:0;border-top:1px solid var(--line2);cursor:pointer;
}
.list>.item:first-child,.list>.item:first-of-type{border-top:0}
.item:active{background:#F8F9FA}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #D5DAE0;flex:0 0 auto;display:grid;place-items:center;background:#fff;transition:background .15s,border-color .15s}
.chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .12s}
.item.done .chk{background:var(--pri);border-color:var(--pri)}
.item.done .chk svg{opacity:1}
.item .t1{font-size:14.5px;font-weight:700;letter-spacing:-0.02em;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.item .t1 .d{font-size:12px;color:var(--tx3);font-weight:700;font-variant-numeric:tabular-nums}
.item .t2{display:block;font-size:13px;color:var(--tx2);font-weight:600;margin-top:2px;line-height:1.35;font-variant-numeric:tabular-nums}
.item.done .t2{color:var(--tx3)}
.item .qcount{font-size:12.5px;color:var(--tx2);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.done .qcount{color:var(--pri)}
.item.skip{opacity:.72;cursor:default}
.item.skip .t1{color:var(--tx2)}
.chev{color:var(--tx3);font-size:18px;font-weight:700;transition:transform .2s}
.item.open .chev{transform:rotate(90deg)}
.sub-list{background:#FAFBFC;border-top:1px solid var(--line2)}
.srow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid #EFF2F4;padding:11px 16px 11px 22px;cursor:pointer}
.srow:first-child{border-top:0}
.srow .chk{width:20px;height:20px;border-width:2px}
.srow .chk svg{width:11px;height:11px}
.srow.done .chk{background:var(--pri);border-color:var(--pri)}
.srow .st{font-size:13px;font-weight:700;color:var(--tx)}
.srow .sd{font-size:11.5px;color:var(--tx3);font-weight:600;font-variant-numeric:tabular-nums}
.srow.done .st{color:var(--tx3)}
.tag{font-size:10.5px;font-weight:800;color:var(--tx2);background:#F2F4F6;border-radius:6px;padding:2px 5px}

/* ---------- segmented ---------- */
.seg{display:flex;gap:4px;background:#E8EBEE;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 4px;font-size:14px;font-weight:800;color:var(--tx2);cursor:pointer;transition:background .15s,color .15s;letter-spacing:-0.02em}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(17,24,39,.08)}
.seg.small{border-radius:11px;padding:3px;margin-bottom:0}
.seg.small button{padding:7px 10px;font-size:12.5px;border-radius:9px}
.seg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.range-line{font-size:12.5px;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- 회독 칩 ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:#fff;border-radius:12px;padding:9px 15px;font-size:13.5px;font-weight:800;color:var(--tx2);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;letter-spacing:-0.02em}
.chip.on{background:var(--pri);color:#fff;box-shadow:none}

/* ---------- 회독 선택 목록 ---------- */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{display:block;width:100%;border:0;border-radius:14px;background:#F2F4F6;padding:13px 14px;text-align:left;cursor:pointer;transition:background .15s}
.opt .n{display:block;font-size:15px;font-weight:800;letter-spacing:-0.02em}
.opt .d{display:block;font-size:11.5px;color:var(--tx2);font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.opt .ck{display:none}
.opt.on{background:var(--pri-soft);box-shadow:inset 0 0 0 1.6px var(--pri)}
.opt.on .n{color:var(--pri-strong)}
.opt.on .n::after{content:" ✓"}
.opt.on .d{color:var(--pri-strong)}

/* ---------- calendar ---------- */
.cal{padding:8px 10px 14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 12px}
.cal-title{font-size:17px;font-weight:800;letter-spacing:-0.03em}
.navbtn{width:36px;height:36px;border-radius:11px;border:0;background:#F2F4F6;color:var(--tx2);font-size:17px;font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1}
.navbtn:disabled{opacity:.35;cursor:default}
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.dow-row span{text-align:center;font-size:11px;font-weight:700;color:var(--tx3);padding:2px 0}
.dow-row span:first-child{color:var(--red)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{border:0;background:transparent;border-radius:12px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.cell .cn{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.cell .cs{font-size:8.5px;font-weight:800;height:10px;line-height:10px;color:var(--tx3)}
.cell.out{visibility:hidden}
.cell.sun{background:#FAFBFC}
.cell.sun .cn{color:var(--tx3)}
.cell.sun .cs{color:#C9CED4}
.cell.done{background:var(--pri)}
.cell.done .cn{color:#fff}
.cell.done .cs{color:rgba(255,255,255,.85)}
.cell.miss .cn{color:var(--red)}
.cell.miss .cs{color:var(--red)}
.cell.plan .cs{color:var(--tx3)}
.cell.off{background:#FAFBFC}
.cell.off .cn{color:var(--tx3)}
.cell.off .cs{color:var(--tx3)}
.cell.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cell.sel{box-shadow:inset 0 0 0 2px rgba(25,31,40,.28)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:14px 8px 2px;border-top:1px solid var(--line2);margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:1px}
.legend span{font-size:11px;color:var(--tx2);font-weight:700}
.cal-sum{padding:0 6px 8px;font-size:12.5px;color:var(--tx2);font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- more ---------- */
.more-hero{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:15px;display:block;flex:0 0 auto}
.slot{display:flex;align-items:center;gap:13px;padding:15px 16px;background:#fff;border-top:1px solid var(--line2)}
.slot:first-child{border-top:0}
.slot .ico{width:38px;height:38px;border-radius:12px;background:#F2F4F6;display:grid;place-items:center;flex:0 0 auto}
.slot .ico svg{width:20px;height:20px;stroke:var(--tx2);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.slot .t1{font-size:14.5px;font-weight:700}
.slot .t2{font-size:12px;color:var(--tx3);font-weight:600;margin-top:1px}
.info-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line2);font-size:14px}
.info-row:first-child{border-top:0}
.info-row .k{color:var(--tx2);font-weight:600}
.info-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.sw{width:46px;height:27px;border-radius:999px;background:#D5DAE0;position:relative;flex:0 0 auto;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(17,24,39,.2);transition:transform .18s}
.sw.on{background:var(--pri)}
.sw.on i{transform:translateX(19px)}
details.guide{background:#fff;border-radius:20px;padding:0;overflow:hidden;margin-bottom:12px}
details.guide summary{list-style:none;padding:15px 16px;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary::after{content:"+";color:var(--tx3);font-weight:800}
details.guide[open] summary::after{content:"–"}
.guide-body{padding:0 16px 16px;font-size:13px;color:var(--tx2);line-height:1.65}
.guide-body ol{padding-left:18px;margin:6px 0 0}
.guide-body li{margin-bottom:4px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:var(--safe-b);
}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:58px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);cursor:pointer;padding:0}
.tab svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:-0.01em}
.tab.on{color:var(--pri)}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(17,24,39,.42);opacity:0;pointer-events:none;transition:opacity .22s}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  max-width:560px;margin:0 auto;background:#fff;
  border-radius:24px 24px 0 0;padding:10px 20px calc(20px + var(--safe-b));
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.8,.24,1);
  max-height:85vh;overflow:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 -8px 30px rgba(17,24,39,.12);
}
.sheet.on{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:999px;background:#E5E8EB;margin:4px auto 14px}
.sheet h3{font-size:19px;font-weight:800;letter-spacing:-0.03em;margin:6px 0 2px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(78px + var(--safe-b));transform:translate(-50%,12px);
  z-index:80;background:rgba(25,31,40,.94);color:#fff;
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:calc(100vw - 40px);
  overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- desktop ---------- */
@media (min-width:768px){
  body{background:#EDEFF2}
  .appbar{background:rgba(237,239,242,.92);padding-top:20px}
  main{padding-bottom:calc(88px + var(--safe-b))}
  .tabbar{background:rgba(255,255,255,.98)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
